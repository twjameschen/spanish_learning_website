<html lang="zh-Hant" class="">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- favicon 用 data URI：離線可用，單檔版也不會多一個外部檔案 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%232D3047%22%2F%3E%3Ccircle%20cx%3D%2245%22%20cy%3D%2219%22%20r%3D%228%22%20fill%3D%22%23FFD166%22%2F%3E%3Cpath%20d%3D%22M4%2054%20L24%2022%20L37%2043%20L45%2031%20L60%2054%20Z%22%20fill%3D%22%23FF8A5B%22%2F%3E%3Cpath%20d%3D%22M24%2022%20L31%2033%20L17%2033%20Z%22%20fill%3D%22%234ECDC4%22%2F%3E%3C%2Fsvg%3E" />
    <meta name="description" content="Camino a Quito — 離線西班牙文學習網站（拉丁美洲／厄瓜多變體）" />
    <title>Camino a Quito · 西班牙文之路</title>
    <script>
      // 在 React 掛載前就套用主題，避免深色模式使用者看到一閃的白畫面。
      // file:// 下 localStorage 會丟 SecurityError，所以整段包在 try 裡。
      (function () {
        try {
          var raw = localStorage.getItem('camino:settings');
          var theme = 'system';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (typeof parsed === 'string') parsed = JSON.parse(parsed);
            theme = (parsed && parsed.state && parsed.state.theme) || 'system';
          }
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* file:// 或隱私模式：維持淺色，之後由 React 補上 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
